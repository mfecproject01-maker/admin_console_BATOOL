services:
  - type: web
    name: ba-tool-backend
    runtime: python
    rootDir: backend

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DATABASE_URL
        sync: false  # กรอก Supabase connection string ใน Render Dashboard

      - key: SECRET_KEY
        generateValue: true

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

      - key: ENVIRONMENT
        value: production

      - key: ADMIN_USERNAME
        value: admin

      - key: ADMIN_PASSWORD
        sync: false

      - key: ALLOWED_ORIGINS
        sync: false  # Set to your production frontend URL(s), e.g.: https://your-app.vercel.app

      - key: ALLOWED_ORIGIN_REGEX
        sync: false  # Optional: regex for Vercel preview URLs, e.g.: https://your-app(-[a-z0-9]+)?\.vercel\.app
